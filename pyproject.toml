[project]
name = "freelance-rate-cli"
version = "1.0.0"
description = "Calculate the hourly rate you need to charge as a freelancer. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "hourly-rate", "pricing", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-rate-cli"
Repository = "https://github.com/kleogeos/freelance-rate-cli"

[project.scripts]
freelance-rate = "rate:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rate"]
